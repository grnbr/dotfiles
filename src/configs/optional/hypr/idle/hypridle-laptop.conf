general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 150
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

# Lock after 5 minutes
listener {
    timeout = 310
    on-timeout = loginctl lock-session
}

# Screen off after 5.5 minutes
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# While locked, turn the screen off after 15s of inactivity
listener {
    timeout = 15
    on-timeout = ~/.config/hypr/idle/on-lock.sh
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_inhibit = true
}

# Suspend after 15 minutes
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
