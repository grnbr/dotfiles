backend = "glx";
vsync = true;
use-damage = true;

corner-radius = 18;
inactive-opacity = 0.9;
active-opacity = 0.97;

blur: {
        method = "dual_kawase";
        strength = 5;
      };

rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'polybar'"
];

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

shadow = true;
shadow-radius = 10;
shadow-opacity = 0.3;
shadow-offset-x = -10;
shadow-offset-y = -10;

fading = true;
fade-in-step = 0.09;
fade-out-step = 0.09;

