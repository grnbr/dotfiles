backend = "glx";
vsync = true;
use-damage = true;

corner-radius = 18;
inactive-opacity = 0.9;
active-opacity = 0.97;

blur: {
        method = "dual_kawase";
        strength = 5;
      };


rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'polybar'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'tooltip'"
];

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

